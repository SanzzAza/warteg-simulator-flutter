# Build otomatis Warteg Simulator: menjalankan analyze + test, lalu
# menghasilkan APK, AAB (Android) dan ZIP (Windows) sebagai artifact.
#
# Cara pakai:
#  - Jalankan otomatis setiap push ke main / manual (tab Actions > Run workflow).
#  - Butuh `web/` tidak sama sekali; hanya Android & Windows.
name: Build Warteg Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      # APK release ditandatangani debug key agar bisa langsung diinstal.
      - uses: actions/upload-artifact@v4
        with:
          name: warteg-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: warteg-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Arsipkan hasil build Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath warteg-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: warteg-windows
          path: warteg-windows.zip
          if-no-files-found: error
