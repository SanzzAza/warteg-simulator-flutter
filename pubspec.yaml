name: warteg_simulator
description: "Warteg Simulator — game simulasi warung tegal khas Indonesia. Kelola modal, masak, layani pelanggan, rekrut karyawan, dan kembangkan usaha."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Material Design terbaru (Flutter >=3.47 memisahkan paket ini)
  material_ui: ^1.11.1
  # State management
  flutter_riverpod: ^2.5.3
  # Game engine 2D
  flame: ^1.12.0
  flame_audio: ^2.1.0
  # Penyimpanan lokal (dipilih: Hive — lihat README.md)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/audio/
  fonts:
    # Font dibundel agar render teks konsisten di Android, Windows, dan test.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
